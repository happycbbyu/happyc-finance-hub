name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 이벤트 자동 수집 봇이 커밋한 뒤에도 사이트 재배포 (봇 커밋은 push 트리거가 안 걸림)
  workflow_run:
    workflows: ["금융사 이벤트 자동 수집"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
