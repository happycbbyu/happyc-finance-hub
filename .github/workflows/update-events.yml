name: 금융사 이벤트 자동 수집

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 오전 7시 (한국시간)
    - cron: "0 9 * * *"    # 매일 오후 6시 (한국시간)
  workflow_dispatch:        # Actions 탭에서 'Run workflow' 버튼으로 수동 실행

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: 패키지 설치
        run: |
          pip install -r crawler/requirements.txt
          python -m playwright install --with-deps chromium

      - name: 이벤트 수집
        run: python crawler/crawl.py

      - name: 사이트 데이터 생성 (live-events.js)
        run: python crawler/build_site_data.py

      - name: 변경사항 커밋
        run: |
          git config user.name "happyc-bot"
          git config user.email "actions@github.com"
          git add live-events.js crawler/output/events.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "이벤트 자동 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: 수집 실패 금융사 확인용 스크린샷 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: crawler/output/debug/
          retention-days: 7
